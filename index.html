<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./Imgs/ultimate_leppard.png" type="image/x-icon">
    <title>Ultimate Leppard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
.home-logo {
  display: flex;
  justify-content: center;
}
img {
  width: 50%;
}
#events {
    text-align: center;
    padding: 50px 20px;
}
.eventsHeading {
    font-size: 2.2rem;
    margin-bottom: 30px;
    color: #fff;
    font-family: 'Nunito Sans', sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
}
.eventsHeading::after {
    content: '';
    display: block;
    width: 5rem;
    height: 0.2rem;
    background: goldenrod;
    margin: 10px auto 0;
}
.fb-page-container {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}
    </style>
</head>

<body>

<div id="fb-root"></div>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_GB/sdk.js#xfbml=1&version=v18.0"></script>

<main>
    <!-- ---HOME SECTION--- -->
    <home>
        <div class="home-logo" data-aos="zoom-in">
            <img src="./Imgs/ultimate_leppard.png" alt="Ultimate Leppard" style="width:75%">
        </div>
        <p class="homePara">We are the UK's number 1 Def Leppard tribute band.<br></p>
        <p class="homePara">For booking enquiries email <a href="mailto:info@ultimateleppard.co.uk">info@ultimateleppard.co.uk</a><br></p>
    </home>

    <!-- ---UPCOMING EVENTS SECTION--- -->
    <section id="events">
        <h2 class="eventsHeading">Upcoming Events</h2>
        <div class="fb-page-container" data-aos="fade-up">
            <div class="fb-page" 
                data-href="https://www.facebook.com/ultimateleppard" 
                data-tabs="events" 
                data-width="500" 
                data-height="500" 
                data-small-header="true" 
                data-adapt-container-width="true" 
                data-hide-cover="true" 
                data-show-facepile="false">
            </div>
        </div>
    </section>
    
</main>           
     
    <!-- FOOTER SECTION IS HERE -->
    <footer>
        <div class="footer-section">
            <div class="footer-item social" data-aos="fade-up" data-aos-duration="3000">
                <h2>Connect With Us</h2>
                <ul>                    
                    <li><a href="https://www.facebook.com/ultimateleppard"><i class="fa-brands fa-facebook"></i></a></li>
                    <li><a href="https://www.instagram.com/ultimateleppard/"><i class="fa-brands fa-instagram"></i></a></li>
                    <li><a href="https://tiktok.com/@ultimate.leppard"><i class="fa-brands fa-tiktok"></i></a></li>
                    <li><a href="https://www.youtube.com/@ultimateleppard1926"><i class="fa-brands fa-youtube"></i></a></li>
                    <li><a href="https://www.etsy.com/shop/UltimateLeppard"><i class="fa-brands fa-etsy"></i></a></li>
                </ul>
            </div>
        </div>
        <p class="footerPara">Disclaimer: We are in no way associated with the real Def Leppard, we simply hope to do our idols proud!<br></p>
        <p></p>
        <p></p>
    </footer>
       
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="./index.js"></script>
    
</body>   
</html>
