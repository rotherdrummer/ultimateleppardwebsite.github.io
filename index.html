<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./Imgs/ultimate_leppard.png" type="image/x-icon">
    <title>Ultimate Leppard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
.home-logo {
  display: flex;
  justify-content: center;
}
img {
  width: 50%;
}
#events {
    text-align: center;
    padding: 50px 20px;
}
.eventsHeading {
    font-size: 2.2rem;
    margin-bottom: 10px;
    color: #fff;
    font-family: 'Nunito Sans', sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
}
.eventsHeading::after {
    content: '';
    display: block;
    width: 5rem;
    height: 0.2rem;
    background: goldenrod;
    margin: 10px auto 20px;
}
.eventsSubHeading {
    font-size: 1.1rem;
    color: rgb(255, 209, 0);
    font-family: 'Ubuntu', sans-serif;
    margin-bottom: 30px;
    letter-spacing: 1px;
}
.event-card {
    display: inline-block;
    background: #190f0f;
    border: 1px solid goldenrod;
    border-radius: 12px;
    padding: 30px 40px;
    max-width: 500px;
    width: 100%;
    box-shadow: rgba(254, 156, 0, 0.35) 0px 5px 15px;
}
.event-details h3 {
    font-size: 1.4rem;
    margin-bottom: 16px;
    color: #ffffff;
    font-family: 'Nunito Sans', sans-serif;
    letter-spacing: 1px;
}
.event-details p {
    margin: 10px 0;
    font-size: 1.05rem;
    color: rgb(255, 209, 0);
    font-family: 'Ubuntu', sans-serif;
}
.event-details i {
    margin-right: 8px;
    color: rgb(255, 111, 0);
}
.ticket-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 30px;
    background-color: rgb(255, 111, 0);
    color: #fff;
    font-weight: bold;
    border-radius: 6px;
    text-decoration: none;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    letter-spacing: 1px;
    border: 2px solid rgb(255, 111, 0);
    transition: all 0.3s ease-in;
}
.ticket-btn:hover {
    background: transparent;
    color: rgb(255, 111, 0);
}
.eventsFbNote {
    margin-top: 24px;
    color: #fff;
    font-family: 'Ubuntu', sans-serif;
    font-size: 0.95rem;
}
    </style>
</head>

<body>
<main>
    <!-- ---HOME SECTION--- -->
    <home>
        <div class="home-logo" data-aos="zoom-in">
            <img src="./Imgs/ultimate_leppard.png" alt="Ultimate Leppard" style="width:75%">
        </div>
        <p class="homePara">We are the UK's number 1 Def Leppard tribute band.<br></p>
        <p class="homePara">For booking enquiries email <a href="mailto:info@ultimateleppard.co.uk">info@ultimateleppard.co.uk</a><br></p>
    </home>

    <!-- ---UPCOMING EVENTS SECTION--- -->
    <section id="events">
        <p class="eventsFbNote">Please see our <a href="https://www.facebook.com/ultimateleppard" style="color: rgb(255, 111, 0);">Facebook page</a> for all other events</p>
    </section>
    
</main>           
     
    <!-- FOOTER SECTION IS HERE -->
    <footer>
        <div class="footer-section">
            <div class="footer-item social" data-aos="fade-up" data-aos-duration="3000">
                <h2>Connect With Us</h2>
                <ul>                    
                    <li><a href="https://www.facebook.com/ultimateleppard"><i class="fa-brands fa-facebook"></i></a></li>
                    <li><a href="https://www.instagram.com/ultimateleppard/"><i class="fa-brands fa-instagram"></i></a></li>
                    <li><a href="https://tiktok.com/@ultimate.leppard"><i class="fa-brands fa-tiktok"></i></a></li>
                    <li><a href="https://www.youtube.com/@ultimateleppard1926"><i class="fa-brands fa-youtube"></i></a></li>
                    <li><a href="https://www.etsy.com/shop/UltimateLeppard"><i class="fa-brands fa-etsy"></i></a></li>
                </ul>
            </div>
        </div>
        <p class="footerPara">Disclaimer: We are in no way associated with the real Def Leppard, we simply hope to do our idols proud!<br></p>
        <p></p>
        <p></p>
    </footer>
       
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="./index.js"></script>
    
</body>   
</html>
